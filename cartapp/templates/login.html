{% load static %}
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .auth-card{

    width:420px;
    background:#171b24;
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:35px;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,.35);

}

.tabs{

    display:flex;
    margin-bottom:30px;
    background:#11141b;
    border-radius:50px;
    padding:5px;

}

.tab{

    flex:1;
    border:none;
    padding:13px;
    border-radius:50px;
    background:none;
    color:#bbb;
    cursor:pointer;
    font-size:16px;
    transition:.3s;

}

.tab.active{

    background:#f6a300;
    color:#111;
    font-weight:600;

}

.form{

    display:none;
    animation:fade .4s;

}

.active-form{

    display:block;

}

.form h2{

    font-size:32px;
    margin-bottom:8px;

}

.form p{

    color:#999;
    margin-bottom:25px;

}

.input-box{

    margin-bottom:18px;

}

.input-box input{

    width:100%;
    padding:15px 18px;
    border-radius:12px;
    border:1px solid #2f3642;
    background:#1f2430;
    color:white;
    font-size:15px;
    outline:none;
    transition:.3s;

}

.input-box input:focus{

    border-color:#f6a300;

}

.remember{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;

}

.remember a{

    color:#f6a300;
    text-decoration:none;

}

.auth-btn{

    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#f6a300;
    color:#111;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;

}

.auth-btn:hover{

    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(246,163,0,.35);

}

.divider{

    text-align:center;
    margin:25px 0;
    color:#888;
    position:relative;

}

.divider::before{

    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:40%;
    height:1px;
    background:#333;

}

.divider::after{

    content:"";
    position:absolute;
    right:0;
    top:50%;
    width:40%;
    height:1px;
    background:#333;

}

.google-btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #333;
    background:#242b36;
    color:white;
    cursor:pointer;
    transition:.3s;
}
.google-btn:hover{
    background:#303845;
}
.error{
    color: red;
}
.success{
    color: green;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
    </style>
</head>
<body>
<CENTER>

<section class="hero auth-hero" id="hero">


        <div>
            {% if messages %}
            {% for message in messages %}
            <p class="{{message.tags}}">{{ message }}</p>
            {% endfor %}
            {% endif  %}
        </div>


 <!-- Authentication Card -->
<div class="auth-card">

    <div class="tabs">
        <button class="tab active" onclick="showLogin()">Login</button>
        <button class="tab" onclick="showSignup()">Sign Up</button>
    </div>

        

    <!-- Login Form -->
    <form id="loginForm" class="form active-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <h2>Login</h2>

        <div class="input-box">
            <input type="text" name="username" placeholder="Username" minlength="5" maxlength="12" required>
        </div>

        <div class="input-box">
            <input type="text" placeholder="Password" name="password" minlength="6" required>
        </div>

        <div class="remember">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="auth-btn" name="login">
            Login
        </button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <h2>Create Account</h2>


        <div class="input-box">

            <input type="text" name="username" placeholder="Username" maxlength="15" minlength="5" required>
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="input-box">
            <input type="text" name="password" placeholder="Password" minlength="6" required>
        </div>

        <div class="input-box">
            <input type="text" name="address" placeholder="Your address" minlength="7" required>
        </div>

        <div class="input-box">
            <input type="text" name="phone" placeholder="Phone no" minlength="10" required>
        </div>

        <button class="auth-btn" type="submit" name="register">
            Create Account
        </button>

    </form>

</div>
</section>
</CENTER>

<script>


const login = document.getElementById("loginForm");
const signup = document.getElementById("signupForm");

const tabs = document.querySelectorAll(".tab");

function showLogin(){

    login.classList.add("active-form");
    signup.classList.remove("active-form");

    tabs[0].classList.add("active");
    tabs[1].classList.remove("active");

}

function showSignup(){

    signup.classList.add("active-form");
    login.classList.remove("active-form");

    tabs[1].classList.add("active");
    tabs[0].classList.remove("active");

}

</script>

{% if register %}
<script>
    showSignup()
</script>
{% else %}
<script>
    showLogin()
</script>
{% endif %}


</body>
</html>
